name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run validate:units
      # The manifest is committed so it reviews as a diff, which means it can go
      # stale: change an asset, forget the bake, and the file still claims the
      # old hash. Re-baking and requiring no diff makes that a red build rather
      # than a client refused at connect for reasons nobody can explain.
      - run: npm run bake:units
      - run: git diff --exit-code assets/units/manifest.json
