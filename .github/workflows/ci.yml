name: CI

on:
  push:
  pull_request:

# Three jobs rather than one (spec 274). They were nine steps in a row, so CI's
# wall time was their *sum* -- and one of them, `npm test`, is two thirds of it.
# Split, the wall time is the slowest job instead: the suite runs while
# typecheck, lint and the asset gates run beside it, and a lint error is
# reported at 1m rather than at 4m.
#
# The split is by *what the step needs*, not by how long it takes, so it stays
# obvious where a new check belongs: `suite` runs the tests, `static` reads the
# source without running it, `assets` builds things and compares them to what is
# committed. Each pays its own `npm ci`, which on a public repository costs
# nothing but a runner.
#
# What deliberately did **not** change is the *set* of gates, or the fact that
# `suite` runs every test. Selective testing (`npm run test:changed`) is for the
# developer's inner loop, where the alternative is not running them at all; a
# merge gate that only ran what it thought was affected would be trusting a
# dependency graph to be right about the one thing nobody is watching.

jobs:
  suite:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, because `src/server/persistence/` is built on `node:sqlite`
          # (spec 226) and that module landed in 22.5 -- on 20 it is not a
          # slower path or a missing feature, it is `No such built-in module`,
          # so the ten persistence and auth suites fail to *load* while every
          # test that does run passes. `package.json`'s `engines` states the
          # same floor; this is the half that is enforced.
          #
          # 22 rather than the newest available, so CI runs what a developer
          # runs: the floor is 22.5 and there is nothing in the tree that wants
          # a later runtime.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The cacheless forms on purpose. `typecheck:fast` and `lint:fast` exist
      # for a working tree that is warm from the last run; a fresh checkout has
      # nothing to warm, so the cache would be pure bookkeeping -- and a merge
      # gate is the one place where "checked everything, from nothing" is worth
      # more than the seconds.
      - run: npm run typecheck
      - run: npm run lint

  assets:
    name: assets + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:units
      # The manifest is committed so it reviews as a diff, which means it can go
      # stale: change an asset, forget the bake, and the file still claims the
      # old hash. Re-baking and requiring no diff makes that a red build rather
      # than a client refused at connect for reasons nobody can explain.
      - run: npm run bake:units
      - run: git diff --exit-code assets/units/manifest.json
      # The gallery's golden images are committed so a visual change reviews as a
      # picture rather than as a diff nobody can read. Same failure mode as the
      # manifest above: change a widget, forget to re-bake, and the PNGs still
      # show the old one. Re-baking and requiring no diff makes that a red build.
      # (`npm test` already compares against them; this catches a stale *commit*.)
      - run: npm run bake:ui-goldens
      - run: git diff --exit-code src/ui/gallery/goldens
      # The build has never run here (spec 203), which is how `index-*.js`
      # reached 14 MB without anybody noticing: the map was `?raw`-imported, so
      # 11.5 MB of world was compiled in as a string literal. It is a fetched
      # asset now and the bundle is 2 MB, and this is what keeps it that way --
      # a ceiling on emitted JavaScript catches a large asset walking back in by
      # any route, because every route has the same symptom.
      - run: npm run build
      - run: npm run check:bundle
      # The spec-number gate (spec 265). `main` carries 105 specs that share a
      # number with another one, because every session picks its number off
      # `specs/` -- which only ever holds what has merged -- and this repo runs a
      # lot of branches at once. This is the half no local tool can enforce: a
      # branch cannot be merged while it duplicates a number `main` already uses.
      #
      # `checkout` leaves one ref behind, so main has to be fetched before the
      # comparison. Depth 1 is enough -- the check reads a file listing, not
      # history -- and a stale baseline is this check's only false positive, so
      # the fetch is a step of its own rather than something it assumes.
      #
      # Last, with the other `check:` gates, because the fix is a rename: a
      # session that trips this should still get its test results from the run
      # that told it.
      - run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - run: npm run check:specs
