name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run validate:units
      # The manifest is committed so it reviews as a diff, which means it can go
      # stale: change an asset, forget the bake, and the file still claims the
      # old hash. Re-baking and requiring no diff makes that a red build rather
      # than a client refused at connect for reasons nobody can explain.
      - run: npm run bake:units
      - run: git diff --exit-code assets/units/manifest.json
      # The gallery's golden images are committed so a visual change reviews as a
      # picture rather than as a diff nobody can read. Same failure mode as the
      # manifest above: change a widget, forget to re-bake, and the PNGs still
      # show the old one. Re-baking and requiring no diff makes that a red build.
      # (`npm test` already compares against them; this catches a stale *commit*.)
      - run: npm run bake:ui-goldens
      - run: git diff --exit-code src/ui/gallery/goldens
      # The build has never run here (spec 203), which is how `index-*.js`
      # reached 14 MB without anybody noticing: the map was `?raw`-imported, so
      # 11.5 MB of world was compiled in as a string literal. It is a fetched
      # asset now and the bundle is 2 MB, and this is what keeps it that way --
      # a ceiling on emitted JavaScript catches a large asset walking back in by
      # any route, because every route has the same symptom.
      - run: npm run build
      - run: npm run check:bundle
