name: Deploy to GitHub Pages

# Rebuild and publish the game to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the official Pages deploy action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede an in-flight one, but never cancel a real deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Project site lives at /turbo-deck/, so the asset base must match.
      #
      # VITE_SERVER_URL is which server the published page dials with no
      # `?server=` in the URL (spec 153). Set the PLAY_SERVER_URL repository
      # variable to `wss://your.host/ws` once the box is up; unset, it bakes in
      # an empty string and the page is single-player exactly as it was.
      # `?server=local` turns it off again on a build that has one.
      #
      # What this builds is the **game client** and not the workbench
      # (spec 254): a `vite build` sets `import.meta.env.PROD`, and
      # `src/render/iso3d/client-build.ts` reads it to decide that the six
      # benches, the eight tuning popovers and the developer readout are not
      # offered. There is deliberately nothing to set here for it -- keying it
      # off the bundle rather than off a variable in this file is what makes
      # the thing CI builds the thing that ships, with no way to publish the
      # workbench by forgetting something. `?client=workbench` on the deployed
      # URL is the way back for anybody who wants the benches.
      - run: npm run build -- --base=/turbo-deck/
        env:
          VITE_SERVER_URL: ${{ vars.PLAY_SERVER_URL }}
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
