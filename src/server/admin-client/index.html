<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>turbo-deck admin</title>
    <link rel="icon" href="data:," />
    <!--
      The admin console (spec 154).

      One page, no bundler, no dependency: it speaks the same binary protocol the
      server does, by hand, in the `W`/`Rd` pair at the top of the script. That is
      deliberate -- it is served as a static file by `src/server/index.ts`, so
      there is nothing to build before an operator can use it.

      The shape it is built around: **a selection, not a form per action.** The
      player table is polled live and one row is selected; every action reads that
      selection rather than an id typed into a box beside it. Before spec 154 the
      table and the actions were two unconnected halves of the page and you
      retyped an id per action, correctly, or you moderated the wrong person.

      How a token gets in (spec 226). The server signs a throwaway one per boot,
      so pasting a JWT is not a first-run chore -- it is the first thing an
      operator does every restart, over a remembered token the reboot guaranteed
      is wrong. Three rules, and the first two are not conveniences:

        - **The clipboard is offered, never trusted.** `readToken` parses the
          same fields `admin/auth.ts` does, minus the signature, and something
          that is not an admin token is never put in the field and never sent.
        - **Nothing automatic disturbs a live session, or a field being typed
          in.** The button is the explicit ask and is the path that always works.
        - **A token the page already has is not adopted again**, which is what
          stops a paste-and-connect loop by construction.
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #101317;
        --panel: #171b21;
        --panel-2: #1d222a;
        --line: #272d37;
        --line-soft: #21262e;
        --text: #dfe4ea;
        --dim: #8b97a7;
        --dimmer: #6a7585;
        --accent: #6fa8ff;
        --accent-bg: #1e2c44;
        --ok: #79d98d;
        --warn: #e8c56a;
        --err: #ef7f86;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0 16px 24px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      }

      /* --- header ------------------------------------------------------- */
      /*
        Sticky, because the two things an operator watches -- whether the socket
        is up and how many people are on -- used to scroll away with everything
        else the moment the roster got long.
      */
      header {
        position: sticky; top: 0; z-index: 5;
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        margin: 0 0 12px; padding: 12px 0 10px;
        background: var(--bg); border-bottom: 1px solid var(--line-soft);
      }
      h1 {
        font-size: 13px; margin: 0; letter-spacing: 0.09em; text-transform: uppercase;
        color: var(--dim); font-weight: 600;
      }
      .spacer { flex: 1; }
      .pill {
        font: 600 11px/1 var(--mono); letter-spacing: 0.04em; text-transform: uppercase;
        padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line);
        background: var(--panel); color: var(--dim);
      }
      .pill.live { color: var(--ok); border-color: #2c4a35; background: #14251a; }
      .pill.down { color: var(--err); border-color: #472a2d; background: #241618; }
      .pill.count { color: var(--text); }
      .pill.count b { color: var(--accent); }
      /* A url and a token subject are not labels: they keep their own case. */
      .pill.plain { text-transform: none; letter-spacing: 0; font-weight: 500; }
      .pill.plain b { color: var(--text); font-weight: 600; }

      /* --- panels ------------------------------------------------------- */
      .panel {
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        padding: 12px 13px 13px;
      }
      .panel h2, .group > h3 {
        margin: 0 0 9px; font-size: 10px; letter-spacing: 0.11em; text-transform: uppercase;
        color: var(--dimmer); font-weight: 600;
      }
      .panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
      .panel-head h2 { margin: 0; }
      .group { border-top: 1px solid var(--line-soft); margin-top: 13px; padding-top: 11px; }
      .group:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }

      .columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); gap: 12px; align-items: start; }
      @media (max-width: 1000px) { .columns { grid-template-columns: minmax(0, 1fr); } }

      /* --- controls ----------------------------------------------------- */
      input, select, button {
        font: inherit; color: var(--text); background: var(--panel-2);
        border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; min-width: 0;
      }
      input[type='number'] { font-family: var(--mono); }
      input:focus, select:focus, button:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
      button { cursor: pointer; background: #232b36; border-color: #333d4c; white-space: nowrap; }
      button:hover:not(:disabled) { background: #2c3644; border-color: #435268; }
      button.primary { background: var(--accent-bg); border-color: #35507e; color: #cfe0ff; }
      button.primary:hover:not(:disabled) { background: #26385a; }
      button.danger { background: #2b1d20; border-color: #4d3034; color: #f0b4b8; }
      button.danger:hover:not(:disabled) { background: #3a2429; }
      button:disabled, input:disabled, select:disabled { opacity: 0.4; cursor: not-allowed; }
      label { display: block; font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--dimmer); margin-bottom: 3px; }
      .row { display: flex; gap: 6px; align-items: flex-end; }
      .row > * { flex: 1; }
      .row > button { flex: 0 0 auto; }
      .row + .row { margin-top: 7px; }
      /*
        A field is a label over a control, so the control is the width of the
        field -- without this an input keeps its own default width whatever share
        of the row it was given, which is why the token box was narrower than the
        server box beside it and why two number fields in the same panel came out
        different sizes.
      */
      .field { min-width: 0; }
      .field > input, .field > select { width: 100%; }
      button.ghost { background: transparent; border-color: var(--line); color: var(--dim); padding: 3px 8px; font-size: 11px; }
      button.ghost:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }

      /* --- the connect bar ---------------------------------------------- */
      /*
        A url, a 200-character secret and the buttons that use them are worth a
        row of the page for about four seconds a boot. So once the token is
        accepted the bar is *gone* rather than collapsed, and what survives of it
        -- who the token says you are, what it has left, and the way back -- is
        two pills and a button in the header, which is where the rest of the
        connection already lives.
      */
      #conn { margin-bottom: 12px; }
      #conn[data-state='live'] { display: none; }
      #token { font-family: var(--mono); font-size: 12px; }
      .hint { margin-top: 8px; font-size: 11px; color: var(--dimmer); }

      /* --- the player table --------------------------------------------- */
      .scroll { overflow-x: auto; }
      /*
        Bounded, so a busy server cannot push the actions beside it off the
        bottom of the page -- and the head sticks to the top of that region
        rather than to the page, so the columns stay named while it scrolls. The
        underline is a shadow because a collapsed border does not travel with a
        sticky cell.
      */
      .roster { max-height: min(58vh, 520px); overflow: auto; }
      .roster thead th { position: sticky; top: 0; z-index: 1; background: var(--panel); box-shadow: inset 0 -1px 0 var(--line); }
      table { border-collapse: collapse; width: 100%; font-size: 12px; }
      th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
      th { color: var(--dimmer); font-weight: 600; font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; }
      td.num, th.num { text-align: right; font-family: var(--mono); }
      #players tbody tr { cursor: pointer; }
      #players tbody tr:hover { background: #1b212a; }
      #players tbody tr.selected { background: var(--accent-bg); }
      #players tbody tr.selected td { border-bottom-color: #35507e; }
      #players tbody tr.dead .who { color: var(--err); }
      .who { font-weight: 600; }
      .id { color: var(--dimmer); font-family: var(--mono); font-size: 11px; }
      .tag { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: #33261c; color: var(--warn); }
      .empty { color: var(--dimmer); padding: 18px 0; text-align: center; }

      /* --- the selected player's card ----------------------------------- */
      #card { margin-bottom: 12px; }
      #card .name { font-size: 15px; font-weight: 600; }
      #card .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-top: 8px; font-size: 12px; }
      #card .facts span { color: var(--dimmer); }
      #card .facts b { font-family: var(--mono); font-weight: 500; }
      .bar { height: 5px; border-radius: 3px; background: #262c35; margin-top: 8px; overflow: hidden; }
      .bar > i { display: block; height: 100%; background: var(--accent); }
      .none { color: var(--dimmer); font-style: italic; }

      /* --- collapsible world tools -------------------------------------- */
      details.panel { padding: 0; }
      details.panel > summary {
        cursor: pointer; padding: 10px 13px; font-size: 10px; letter-spacing: 0.11em;
        text-transform: uppercase; color: var(--dimmer); font-weight: 600;
      }
      details.panel[open] > summary { border-bottom: 1px solid var(--line-soft); }
      details.panel > .body { padding: 12px 13px 13px; }
      .tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }

      /* --- log ---------------------------------------------------------- */
      #logPanel { margin-top: 12px; }
      #log {
        height: 160px; min-height: 54px; resize: vertical; overflow: auto; padding: 8px 10px;
        background: #0c0e12; border: 1px solid var(--line); border-radius: 6px;
        font: 12px/1.6 var(--mono);
      }
      #log div { white-space: pre-wrap; }
      #log .t { color: #4c5666; }
      .ok { color: var(--ok); } .err { color: var(--err); }
      .warn { color: var(--warn); } .dim { color: var(--dimmer); }
    </style>
  </head>
  <body>
    <header>
      <h1>turbo-deck admin</h1>
      <span id="status" class="pill down">disconnected</span>
      <span id="count" class="pill count" hidden><b>0</b>&nbsp;online</span>
      <span class="spacer"></span>
      <span id="where" class="pill plain" hidden></span>
      <span id="connWho" class="pill plain" hidden><b id="connSub"></b><span id="connTtl"></span></span>
      <button id="change" class="ghost" hidden>change token</button>
      <button id="disconnect" class="ghost" disabled>disconnect</button>
    </header>

    <div id="conn" class="panel" data-state="open">
      <div class="row">
        <div class="field"><label for="url">server</label><input id="url" placeholder="ws://localhost:8787" spellcheck="false" autocomplete="off" /></div>
        <div class="field" style="flex: 3">
          <label for="token">admin token</label>
          <input id="token" placeholder="the JWT the server printed on boot" spellcheck="false" autocomplete="off" />
        </div>
        <button id="paste">paste token</button>
        <button id="connect" class="primary">connect</button>
      </div>
      <div id="hint" class="hint"></div>
    </div>

    <div class="columns">
      <div class="panel">
        <h2>players &mdash; click one to act on it</h2>
        <div class="scroll roster">
          <table id="players">
            <thead>
              <tr>
                <th>player</th>
                <th class="num">lvl</th>
                <th class="num">xp</th>
                <th class="num">sp/ap</th>
                <th class="num">hp</th>
                <th>zone</th>
                <th class="num">x</th>
                <th class="num">y</th>
                <th class="num">ent</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div id="playersEmpty" class="empty">not connected</div>
      </div>

      <div>
        <div id="card" class="panel">
          <div class="none">no player selected</div>
        </div>

        <div class="panel">
          <h2>actions</h2>

          <div class="group">
            <h3>progression</h3>
            <div class="row">
              <div class="field"><label for="levelAmount">levels</label><input id="levelAmount" type="number" min="1" max="60" value="1" /></div>
              <button data-act="giveLevels">give levels</button>
            </div>
            <div class="row">
              <div class="field"><label for="xpAmount">experience</label><input id="xpAmount" type="number" min="1" value="500" /></div>
              <button data-act="giveXp">give xp</button>
            </div>
            <div class="row" style="margin-top: 9px">
              <button data-act="resetLevel" class="danger">reset level</button>
              <button data-act="resetXp" class="danger">reset xp</button>
            </div>
          </div>

          <div class="group">
            <h3>items</h3>
            <div class="field"><label for="itemId">item</label><select id="itemId"></select></div>
            <div class="row" style="margin-top: 7px">
              <div class="field"><label for="itemCount">count</label><input id="itemCount" type="number" min="1" max="999" value="1" /></div>
              <button data-act="giveItem">give item</button>
            </div>
          </div>

          <div class="group">
            <h3>presence</h3>
            <div class="row">
              <div class="field"><label for="reason">reason</label><input id="reason" placeholder="afk" /></div>
              <button data-act="kick">kick</button>
            </div>
            <!--
              No heal beside the kill: a dead player is respawned at full health
              by the server after RESPAWN_DELAY_TICKS, so a kill undoes itself.
              "heal all players" is an event, and lives with the events.
            -->
            <div class="row" style="margin-top: 9px">
              <button data-act="kill" class="danger">kill</button>
            </div>
            <div class="row" style="margin-top: 9px">
              <div class="field"><label for="tpX">teleport to</label><input id="tpX" type="number" value="600" /></div>
              <div class="field"><label for="tpY">&nbsp;</label><input id="tpY" type="number" value="450" /></div>
              <button data-act="teleport">go</button>
            </div>
            <div class="row" style="margin-top: 9px">
              <div class="field"><label for="seconds">seconds</label><input id="seconds" type="number" min="0" value="300" /></div>
              <button data-act="mute">mute</button>
              <button data-act="unmute">unmute</button>
            </div>
            <div class="row" style="margin-top: 7px">
              <button data-act="ban" class="danger">ban (0 = permanent)</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <details class="panel" style="margin-top: 12px">
      <summary>world tools</summary>
      <div class="body tools">
        <div>
          <h3>entities</h3>
          <div class="field"><label for="spawnType">monster</label><input id="spawnType" value="ravager" /></div>
          <div class="row" style="margin-top: 7px">
            <div class="field"><label for="spawnX">x</label><input id="spawnX" type="number" value="600" /></div>
            <div class="field"><label for="spawnY">y</label><input id="spawnY" type="number" value="450" /></div>
            <div class="field"><label for="spawnCount">n</label><input id="spawnCount" type="number" min="1" value="3" /></div>
          </div>
          <div class="row" style="margin-top: 7px">
            <button data-act="spawn">spawn</button>
            <div class="field"><label for="despawnId">entity id</label><input id="despawnId" type="number" /></div>
            <button data-act="despawn">despawn</button>
          </div>
        </div>

        <div>
          <h3>events</h3>
          <div class="field">
            <label for="eventName">event</label>
            <select id="eventName">
              <option value="raid">raid (magnitude = count)</option>
              <option value="clear">clear (magnitude = radius)</option>
              <option value="heal">heal all players</option>
            </select>
          </div>
          <div class="row" style="margin-top: 7px">
            <div class="field"><label for="evX">x</label><input id="evX" type="number" value="600" /></div>
            <div class="field"><label for="evY">y</label><input id="evY" type="number" value="450" /></div>
            <div class="field"><label for="evMag">mag</label><input id="evMag" type="number" value="5" /></div>
            <button data-act="event">fire</button>
          </div>
          <div class="row" style="margin-top: 11px">
            <div class="field"><label for="bcText">broadcast</label><input id="bcText" placeholder="message to every player" /></div>
            <button data-act="broadcast">send</button>
          </div>
        </div>

        <div>
          <h3>live config</h3>
          <div class="row">
            <div class="field"><label for="cfgKey">key</label><input id="cfgKey" list="cfgKeys" /></div>
            <datalist id="cfgKeys"></datalist>
            <div class="field"><label for="cfgValue">value</label><input id="cfgValue" type="number" step="any" /></div>
            <button data-act="setConfig">set</button>
          </div>
          <table id="config" style="margin-top: 9px"></table>
        </div>
      </div>
    </details>

    <details class="panel" style="margin-top: 12px">
      <summary>audit log</summary>
      <div class="body">
        <button id="getAudit">load the last 50 admin decisions</button>
        <div class="scroll" style="margin-top: 9px"><table id="audit"></table></div>
      </div>
    </details>

    <div id="logPanel" class="panel">
      <div class="panel-head">
        <h2>log</h2>
        <span class="spacer"></span>
        <button id="clearLog" class="ghost">clear</button>
      </div>
      <div id="log"></div>
    </div>

    <script>
      // --- the wire, by hand ---------------------------------------------
      // Same layout as `admin-messages.ts`; see net/PROTOCOL.md for the table.
      const T = {
        auth: 0x80, listPlayers: 0x81, kick: 0x82, ban: 0x83, mute: 0x84,
        teleport: 0x85, spawn: 0x86, despawn: 0x87, event: 0x88,
        broadcast: 0x89, setConfig: 0x8a, getConfig: 0x8b, getAudit: 0x8c,
        setProgress: 0x8d, giveItem: 0x8e, getItems: 0x8f, kill: 0x90,
      };
      const R = { ok: 0xa0, error: 0xa1, players: 0xa2, config: 0xa3, audit: 0xa4, items: 0xa5 };
      // `AdminProgressMode` in protocol.ts.
      const MODE = { addLevels: 0, setLevel: 1, addExperience: 2, setExperience: 3 };
      const NAMES = Object.fromEntries(Object.entries(T).map(([k, v]) => [v, k]));

      class W {
        constructor() { this.b = []; }
        u8(v) { this.b.push(v & 0xff); return this; }
        u16(v) { this.b.push(v & 0xff, (v >> 8) & 0xff); return this; }
        u32(v) { for (let i = 0; i < 4; i++) this.b.push((v >>> (i * 8)) & 0xff); return this; }
        f32(v) { const a = new Uint8Array(4); new DataView(a.buffer).setFloat32(0, v, true); this.b.push(...a); return this; }
        f64(v) { const a = new Uint8Array(8); new DataView(a.buffer).setFloat64(0, v, true); this.b.push(...a); return this; }
        varuint(v) { let n = Math.max(0, Math.floor(v)); do { const s = n & 0x7f; n = Math.floor(n / 128); this.u8(n > 0 ? s | 0x80 : s); } while (n > 0); return this; }
        str(s) { const e = new TextEncoder().encode(String(s ?? '')); this.varuint(e.length); this.b.push(...e); return this; }
        out() { return new Uint8Array(this.b); }
      }

      class Rd {
        constructor(buffer) {
          this.b = new Uint8Array(buffer);
          this.v = new DataView(this.b.buffer, this.b.byteOffset, this.b.byteLength);
          this.o = 0;
        }
        u8() { return this.v.getUint8(this.o++); }
        f32() { const x = this.v.getFloat32(this.o, true); this.o += 4; return x; }
        f64() { const x = this.v.getFloat64(this.o, true); this.o += 8; return x; }
        bool() { return this.u8() !== 0; }
        varuint() { let r = 0, s = 1; for (;;) { const b = this.u8(); r += (b & 0x7f) * s; if (!(b & 0x80)) return r; s *= 128; } }
        str() { const n = this.varuint(); const s = new TextDecoder().decode(this.b.subarray(this.o, this.o + n)); this.o += n; return s; }
      }

      // --- the token, by hand ---------------------------------------------
      /*
        The page has no secret, so it cannot check a signature and has no business
        judging one -- `verifyAdminToken` on the server is the only thing that
        grants anything, and that does not change. What the page CAN do is read
        the same fields `auth.ts` reads, which is enough to know whether a string
        is a token this console could use at all.

        That is the whole guard on the clipboard: a clipboard usually holds
        something that is not an admin token -- a password, an ssh key, a url, the
        last line of a chat -- and something that is not an admin token is never
        put in the field and never sent anywhere.

        (`atob` decodes bytes rather than utf-8, so a non-ascii `sub` would come
        back mangled or throw inside the JSON parse and be refused. Every subject
        this server mints is a name; a token that lost the argument here is one
        the operator can still paste by hand.)
      */
      function fromBase64url(segment) {
        const padded = segment.replace(/-/g, '+').replace(/_/g, '/');
        return atob(padded.padEnd(padded.length + ((4 - (padded.length % 4)) % 4), '='));
      }

      /** The claims, or null unless this is a token this page could use. */
      function readToken(text) {
        const raw = String(text ?? '').trim();
        const parts = raw.split('.');
        if (parts.length !== 3) return null;
        let header, body;
        try {
          header = JSON.parse(fromBase64url(parts[0]));
          body = JSON.parse(fromBase64url(parts[1]));
        } catch {
          return null;
        }
        if (!header || header.typ !== 'JWT') return null;
        if (!body || typeof body.sub !== 'string' || body.role !== 'admin') return null;
        if (typeof body.exp !== 'number' || typeof body.iat !== 'number') return null;
        return { raw, sub: body.sub, role: body.role, iat: body.iat, exp: body.exp };
      }

      /** A span, never a clock time: "11h 58m", "4m", "12s". */
      function span(seconds) {
        const total = Math.max(0, Math.round(seconds));
        if (total < 60) return total + 's';
        if (total < 3600) return Math.floor(total / 60) + 'm';
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        return minutes > 0 ? hours + 'h ' + minutes + 'm' : hours + 'h';
      }

      const secondsLeft = (claims) => claims.exp - Date.now() / 1000;

      // --- state ----------------------------------------------------------
      const $ = (id) => document.getElementById(id);
      const val = (id) => $(id).value.trim();
      const num = (id) => Number($(id).value);
      const STORE = 'turbo-deck.admin';
      /** The last profile that authenticated. Never throws: a corrupt one is no profile. */
      const readStore = () => {
        try { return JSON.parse(localStorage.getItem(STORE) ?? '{}') ?? {}; } catch { return {}; }
      };

      let socket = null;
      let authenticated = false;
      let pollTimer = null;
      /** The selection, held by playerId so a poll cannot move it. */
      let selectedId = null;
      let players = [];
      let items = [];

      function log(text, cls) {
        const line = document.createElement('div');
        const at = document.createElement('span');
        at.className = 't';
        at.textContent = new Date().toLocaleTimeString() + '  ';
        const body = document.createElement('span');
        if (cls) body.className = cls;
        body.textContent = text;
        line.append(at, body);
        $('log').prepend(line);
        while ($('log').childElementCount > 300) $('log').lastElementChild.remove();
      }

      function send(bytes) {
        if (!socket || socket.readyState !== WebSocket.OPEN) { log('not connected', 'err'); return false; }
        socket.send(bytes);
        return true;
      }

      const selected = () => players.find((p) => p.playerId === selectedId) ?? null;

      /**
       * An action that needs a selection, refused here rather than sent with an
       * empty player id -- so a stray click cannot reach the server at all.
       */
      function withSelection(build, confirmText) {
        const player = selected();
        if (!player) { log('select a player first', 'err'); return; }
        if (confirmText && !window.confirm(confirmText.replace('%s', player.displayName))) return;
        send(build(player));
      }

      // --- where a token comes from ---------------------------------------
      /**
       * Disarmed by the first refusal, and re-armed by the button. Every browser
       * guards `readText` differently -- Chromium wants a permission, Firefox and
       * Safari want a gesture -- and a page that re-asks on every alt-tab is worse
       * than one that asks once and then offers a button.
       */
      let clipboardArmed = true;
      /** Set by `change token`: holds the bar open over a live session. */
      let connOpen = false;

      function adopt(claims, source) {
        $('token').value = claims.raw;
        log(
          'pasted the token for ' + claims.sub + ' from ' + source +
            ' (' + span(secondsLeft(claims)) + ' left)',
          'ok',
        );
        connOpen = false;
        renderToken();
        connect();
      }

      /**
       * The one rule for a token arriving from anywhere -- the clipboard read,
       * the paste button, or an ordinary ctrl+v into the field.
       *
       * `announce` is false for the automatic read and true for anything the
       * operator asked for: a clipboard usually holds something that is not a
       * token, and a line about it on every alt-tab is noise, while a button that
       * appears to do nothing is worse.
       */
      function offerToken(text, source, announce) {
        const claims = readToken(text);
        if (!claims) {
          if (announce) log(source + ' does not hold an admin token', 'err');
          return 'invalid';
        }
        const left = secondsLeft(claims);
        if (left <= 0) {
          // Refused here rather than at the server: "bad token" and "you copied
          // yesterday's token" are one message and two different fixes. Refused
          // rather than pasted, because writing a dead token over a possibly-live
          // one is destructive.
          if (announce) log(source + ' holds a token that expired ' + span(-left) + ' ago', 'err');
          return 'expired';
        }
        // The whole of "paste it if the page has not got it" -- and what stops a
        // paste-and-connect loop by construction, since adopting fills the field.
        if (claims.raw === val('token')) {
          if (announce) log('that token is already in the field', 'dim');
          return 'same';
        }
        adopt(claims, source);
        return 'adopted';
      }

      /** Never throws and never reports: a browser that says no is an answer. */
      async function readClipboard() {
        if (!navigator.clipboard || !navigator.clipboard.readText) return null;
        try {
          return await navigator.clipboard.readText();
        } catch {
          return null;
        }
      }

      /**
       * An opportunity, never a requirement. Two things it may not do:
       *
       *  - **disturb a live session.** A token copied while connected is the
       *    operator's to apply, through the button.
       *  - **overwrite a field somebody is typing in.**
       *
       * The `hasFocus` guard is there rather than a caught rejection because a
       * read for an unfocused document is refused outright, and a spent attempt
       * is a permission prompt nobody got anything for.
       */
      async function offerClipboard() {
        if (!clipboardArmed || authenticated) return;
        if (!document.hasFocus() || document.activeElement === $('token')) return;
        const text = await readClipboard();
        if (text === null) {
          clipboardArmed = false;
          renderHint();
          return;
        }
        offerToken(text, 'the clipboard', false);
      }

      function renderHint() {
        $('hint').textContent = clipboardArmed
          ? 'the server signs a fresh token every boot \u2014 copy one and it is pasted here on its own'
          : 'this browser will not hand the clipboard over on its own \u2014 press paste token, or ctrl+v into the field';
      }

      /**
       * Where the connection is stated: the bar while it is being made, the
       * header once it is. Both facts in the header come from the token the page
       * is already holding, so neither of them crosses the wire.
       */
      function renderToken() {
        const claims = readToken(val('token'));
        const done = authenticated && !connOpen;
        $('conn').dataset.state = done ? 'live' : 'open';

        $('where').hidden = !done;
        $('where').textContent = val('url');
        $('change').hidden = !done;
        $('connWho').hidden = !done;
        $('connSub').textContent = claims ? claims.sub : 'connected';
        if (claims) {
          const left = secondsLeft(claims);
          $('connTtl').textContent = left > 0 ? ' \u00b7 ' + span(left) + ' left' : ' \u00b7 expired';
          // Amber under a quarter of an hour, because a token that lapses
          // mid-session stops working on the next message rather than at the
          // next reconnect -- `verifyAdminToken` is called on every one of them.
          $('connTtl').className = left <= 0 ? 'err' : left < 900 ? 'warn' : 'dim';
        } else {
          $('connTtl').textContent = '';
        }
        renderHint();
      }

      /**
       * The click that *enters* one of these fields selects all of it; a click
       * inside an already-focused one still places a caret, so a correction to a
       * single character works as it always did.
       *
       * Selecting on `focus` alone does not survive -- the mouseup that ends the
       * click collapses the selection to a caret -- so the mouseup that entered
       * the field is defaulted out, and only that one, or a deliberate
       * drag-select inside the field would go with it.
       */
      function selectOnEntry(input) {
        let entering = false;
        input.addEventListener('mousedown', () => { entering = document.activeElement !== input; });
        input.addEventListener('focus', () => input.select());
        input.addEventListener('mouseup', (event) => {
          if (entering) event.preventDefault();
          entering = false;
        });
        input.addEventListener('blur', () => { entering = false; });
      }

      // --- connection -----------------------------------------------------
      function setStatus(text, cls) {
        $('status').textContent = text;
        $('status').className = 'pill ' + cls;
      }

      function stopPolling() {
        if (pollTimer !== null) { clearInterval(pollTimer); pollTimer = null; }
      }

      function connect() {
        if (socket) { socket.onclose = null; socket.close(); }
        authenticated = false;
        try {
          socket = new WebSocket(val('url'));
        } catch (error) {
          log('bad server url: ' + error.message, 'err');
          return;
        }
        socket.binaryType = 'arraybuffer';
        setStatus('connecting', 'pill');
        $('disconnect').disabled = false;

        socket.onopen = () => {
          setStatus('authenticating', 'pill');
          send(new W().u8(T.auth).str(val('token')).out());
        };
        socket.onclose = () => {
          authenticated = false;
          stopPolling();
          setStatus('disconnected', 'down');
          $('count').hidden = true;
          $('disconnect').disabled = true;
          players = [];
          renderPlayers();
          renderToken();
          $('playersEmpty').textContent = 'not connected';
        };
        socket.onerror = () => log('socket error -- is the server running on that port?', 'err');
        socket.onmessage = (event) => handle(new Rd(event.data));
      }

      /** Everything that happens once the token is accepted. */
      function onAuthenticated() {
        authenticated = true;
        connOpen = false;
        setStatus('connected', 'live');
        renderToken();
        localStorage.setItem(STORE, JSON.stringify({ url: val('url'), token: val('token') }));
        // The catalog is asked for once; the list is polled.
        send(new W().u8(T.getItems).out());
        send(new W().u8(T.getConfig).out());
        refresh();
        stopPolling();
        pollTimer = setInterval(refresh, 1000);
      }

      function refresh() {
        if (!authenticated) return;
        send(new W().u8(T.listPlayers).out());
        // What is left of the token is drawn from the token, so the poll is the
        // only thing that can keep it honest. Nothing about it crosses the wire.
        renderToken();
      }

      // --- replies --------------------------------------------------------
      function handle(r) {
        const type = r.u8();

        if (type === R.ok || type === R.error) {
          const requestType = r.u8();
          const message = r.str();
          const name = NAMES[requestType] ?? '0x' + requestType.toString(16);
          if (requestType === T.auth && type === R.ok) { onAuthenticated(); }
          if (requestType === T.auth && type === R.error) {
            setStatus('rejected', 'down');
            stopPolling();
          }
          log(name + ': ' + message, type === R.ok ? 'ok' : 'err');
          // An action that changed a player shows up in the next poll on its own,
          // but a second of stale numbers under the cursor reads as "nothing
          // happened", so the list is asked for immediately as well.
          if (type === R.ok && requestType !== T.auth && requestType !== T.listPlayers) refresh();
          return;
        }

        if (type === R.players) {
          const count = r.varuint();
          const rows = [];
          for (let i = 0; i < count; i++) {
            rows.push({
              playerId: r.str(), displayName: r.str(), entityId: r.varuint(),
              x: r.f32(), y: r.f32(), z: r.f32(), zone: r.str(), chunk: r.str(),
              health: r.f32(), maxHealth: r.f32(), level: r.varuint(),
              attackDamage: r.f32(), moveSpeed: r.f32(), muted: r.bool(),
              experience: r.varuint(), experienceToNextLevel: r.varuint(),
              unspentSkillPoints: r.varuint(), unspentAttributePoints: r.varuint(),
            });
          }
          players = rows;
          renderPlayers();
          return;
        }

        if (type === R.items) {
          const count = r.varuint();
          const rows = [];
          for (let i = 0; i < count; i++) {
            rows.push({
              id: r.str(), name: r.str(), slot: r.str(),
              levelRequirement: r.varuint(), maxStack: r.varuint(),
            });
          }
          items = rows;
          renderItems();
          return;
        }

        if (type === R.config) {
          const count = r.varuint();
          const rows = [];
          for (let i = 0; i < count; i++) rows.push([r.str(), r.f64()]);
          renderTable('config', ['key', 'value'], rows.map(([k, v]) => [k, v]), [false, true]);
          $('cfgKeys').replaceChildren(...rows.map(([k]) => {
            const option = document.createElement('option');
            option.value = k;
            return option;
          }));
          return;
        }

        if (type === R.audit) {
          const count = r.varuint();
          const rows = [];
          for (let i = 0; i < count; i++) {
            const at = r.f64(), actor = r.str(), action = r.str(), target = r.str(), detail = r.str(), accepted = r.bool();
            rows.push([new Date(at).toLocaleTimeString(), actor, action, target || '-', detail, accepted ? 'ok' : 'REFUSED']);
          }
          renderTable('audit', ['when', 'who', 'what', 'target', 'detail', ''], rows);
          return;
        }

        log('unhandled reply 0x' + type.toString(16), 'dim');
      }

      // --- rendering ------------------------------------------------------
      function renderPlayers() {
        const body = $('players').tBodies[0];
        body.replaceChildren();

        for (const player of players) {
          const tr = document.createElement('tr');
          tr.className =
            (player.playerId === selectedId ? 'selected ' : '') + (player.health <= 0 ? 'dead' : '');
          tr.onclick = () => { selectedId = player.playerId; renderPlayers(); };

          const who = document.createElement('td');
          const name = document.createElement('div');
          name.className = 'who';
          name.textContent = player.displayName;
          const id = document.createElement('div');
          id.className = 'id';
          id.textContent = player.playerId;
          who.append(name, id);
          tr.append(who);

          const cells = [
            [player.level, true],
            [player.experience + ' / ' + player.experienceToNextLevel, true],
            [player.unspentSkillPoints + ' / ' + player.unspentAttributePoints, true],
            [Math.round(player.health) + ' / ' + Math.round(player.maxHealth), true],
            [player.zone, false],
            [Math.round(player.x), true],
            [Math.round(player.y), true],
            [player.entityId, true],
          ];
          for (const [text, isNumber] of cells) {
            const td = document.createElement('td');
            if (isNumber) td.className = 'num';
            td.textContent = String(text);
            tr.append(td);
          }

          const tags = document.createElement('td');
          for (const [text, show] of [['dead', player.health <= 0], ['muted', player.muted]]) {
            if (!show) continue;
            const tag = document.createElement('span');
            tag.className = 'tag';
            tag.textContent = text;
            tags.append(tag, ' ');
          }
          tr.append(tags);
          body.append(tr);
        }

        $('count').hidden = !authenticated;
        $('count').querySelector('b').textContent = String(players.length);
        $('playersEmpty').hidden = players.length > 0 || !authenticated;
        if (authenticated) $('playersEmpty').textContent = 'nobody is online';
        renderCard();
      }

      function renderCard() {
        const card = $('card');
        const player = selected();

        if (!player) {
          const none = document.createElement('div');
          none.className = 'none';
          none.textContent = selectedId === null
            ? 'no player selected'
            : selectedId + ' is no longer online';
          card.replaceChildren(none);
          setActionsEnabled(false);
          return;
        }

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = player.displayName;
        const id = document.createElement('div');
        id.className = 'id';
        id.textContent = player.playerId + ' · entity ' + player.entityId;

        const facts = document.createElement('div');
        facts.className = 'facts';
        const rows = [
          ['level', player.level],
          ['skill points', player.unspentSkillPoints],
          ['attribute points', player.unspentAttributePoints],
          ['experience', player.experience + ' / ' + player.experienceToNextLevel],
          ['health', Math.round(player.health) + ' / ' + Math.round(player.maxHealth)],
          ['damage', player.attackDamage.toFixed(1)],
          ['move speed', Math.round(player.moveSpeed)],
          ['zone', player.zone],
          ['position', Math.round(player.x) + ', ' + Math.round(player.y)],
        ];
        for (const [label, value] of rows) {
          const key = document.createElement('span');
          key.textContent = label;
          const held = document.createElement('b');
          held.textContent = String(value);
          facts.append(key, held);
        }

        const bar = document.createElement('div');
        bar.className = 'bar';
        const fill = document.createElement('i');
        const fraction = player.experienceToNextLevel > 0
          ? Math.min(1, player.experience / player.experienceToNextLevel)
          : 0;
        fill.style.width = (fraction * 100).toFixed(1) + '%';
        bar.append(fill);

        card.replaceChildren(name, id, bar, facts);
        setActionsEnabled(true);
      }

      /**
       * Greys out every action bound to the selection when there is not one, so
       * the page never offers a button that could only refuse.
       */
      function setActionsEnabled(enabled) {
        for (const element of document.querySelectorAll('#card ~ .panel input, #card ~ .panel select, #card ~ .panel button')) {
          element.disabled = !enabled;
        }
      }

      function renderItems() {
        const select = $('itemId');
        const bySlot = new Map();
        for (const item of items) {
          const slot = item.slot === '-' ? 'carried' : item.slot;
          if (!bySlot.has(slot)) bySlot.set(slot, []);
          bySlot.get(slot).push(item);
        }
        select.replaceChildren(...[...bySlot.entries()].map(([slot, group]) => {
          const optgroup = document.createElement('optgroup');
          optgroup.label = slot;
          for (const item of group.sort((a, b) => a.name.localeCompare(b.name))) {
            const option = document.createElement('option');
            option.value = item.id;
            option.textContent =
              item.name + ' · L' + item.levelRequirement +
              (item.maxStack > 1 ? ' · stacks ' + item.maxStack : '');
            optgroup.append(option);
          }
          return optgroup;
        }));
        log(items.length + ' item(s) in the catalog', 'dim');
      }

      function renderTable(id, headers, rows, numeric = []) {
        const table = $(id);
        table.replaceChildren();
        const head = table.insertRow();
        for (let i = 0; i < headers.length; i++) {
          const th = document.createElement('th');
          if (numeric[i]) th.className = 'num';
          th.textContent = headers[i];
          head.append(th);
        }
        for (const row of rows) {
          const tr = table.insertRow();
          for (let i = 0; i < row.length; i++) {
            const td = tr.insertCell();
            if (numeric[i]) td.className = 'num';
            td.textContent = String(row[i]);
          }
        }
      }

      // --- actions --------------------------------------------------------
      const progress = (mode, amount) => (p) =>
        new W().u8(T.setProgress).str(p.playerId).u8(mode).u32(amount).out();

      const actions = {
        giveLevels: () => withSelection(progress(MODE.addLevels, Math.max(1, num('levelAmount')))),
        giveXp: () => withSelection(progress(MODE.addExperience, Math.max(1, num('xpAmount')))),
        // Confirmed, because a level low enough to stop paying for the skill tree
        // clears it -- the one action here that destroys something a player built.
        resetLevel: () => withSelection(progress(MODE.setLevel, 1), 'Reset %s to level 1? A skill tree the new level cannot pay for is cleared.'),
        resetXp: () => withSelection(progress(MODE.setExperience, 0)),
        giveItem: () => withSelection((p) =>
          new W().u8(T.giveItem).str(p.playerId).str(val('itemId')).u16(Math.max(1, num('itemCount'))).out()),
        kick: () => withSelection((p) => new W().u8(T.kick).str(p.playerId).str(val('reason') || 'kicked by an admin').out()),
        kill: () => withSelection((p) => new W().u8(T.kill).str(p.playerId).out()),
        teleport: () => withSelection((p) => new W().u8(T.teleport).str(p.playerId).f32(num('tpX')).f32(num('tpY')).out()),
        mute: () => withSelection((p) => new W().u8(T.mute).str(p.playerId).u32(Math.max(1, num('seconds'))).out()),
        unmute: () => withSelection((p) => new W().u8(T.mute).str(p.playerId).u32(0).out()),
        ban: () => withSelection(
          (p) => new W().u8(T.ban).str(p.playerId).u32(Math.max(0, num('seconds'))).str(val('reason') || 'banned by an admin').out(),
          'Ban %s? They are kicked immediately and refused on reconnect.',
        ),

        spawn: () => send(new W().u8(T.spawn).str(val('spawnType')).f32(num('spawnX')).f32(num('spawnY')).u16(Math.max(1, num('spawnCount'))).out()),
        despawn: () => send(new W().u8(T.despawn).varuint(num('despawnId')).out()),
        event: () => send(new W().u8(T.event).str(val('eventName')).f32(num('evX')).f32(num('evY')).f32(num('evMag')).out()),
        broadcast: () => send(new W().u8(T.broadcast).str(val('bcText')).out()),
        setConfig: () => send(new W().u8(T.setConfig).str(val('cfgKey')).f64(num('cfgValue')).out()),
      };

      for (const button of document.querySelectorAll('button[data-act]')) {
        button.onclick = () => actions[button.dataset.act]();
      }
      $('connect').onclick = connect;
      $('disconnect').onclick = () => { if (socket) socket.close(); };
      $('getAudit').onclick = () => send(new W().u8(T.getAudit).u16(50).out());
      $('clearLog').onclick = () => $('log').replaceChildren();
      $('change').onclick = () => {
        connOpen = true;
        renderToken();
        $('token').focus();
      };

      // The explicit ask. It re-arms the automatic path, because a browser that
      // refused before the operator granted the permission will answer now.
      $('paste').onclick = async () => {
        const text = await readClipboard();
        if (text === null) {
          clipboardArmed = false;
          renderHint();
          log('the browser would not hand over the clipboard \u2014 paste into the field with ctrl+v', 'err');
          return;
        }
        clipboardArmed = true;
        renderHint();
        offerToken(text, 'the clipboard', true);
      };

      // A native paste needs no permission from anybody, so this is the path
      // that always works. Anything that is not a whole live token is left to
      // the browser to paste and to the operator to look at.
      $('token').addEventListener('paste', (event) => {
        const text = event.clipboardData ? event.clipboardData.getData('text') : '';
        const claims = readToken(text);
        if (!claims || claims.raw === val('token')) return;
        if (secondsLeft(claims) <= 0) {
          log('that token expired ' + span(-secondsLeft(claims)) + ' ago', 'err');
          return;
        }
        event.preventDefault();
        adopt(claims, 'the field');
      });

      // The way back out of `change token`, which is otherwise a panel with no
      // close: the stored profile is the token the live session is actually on,
      // so escape restores it rather than leaving half of a new one in the field.
      $('token').addEventListener('keydown', (event) => {
        if (event.key !== 'Escape' || !authenticated) return;
        const stored = readStore();
        if (stored.token) $('token').value = stored.token;
        connOpen = false;
        $('token').blur();
        renderToken();
      });

      selectOnEntry($('token'));
      selectOnEntry($('url'));

      // Enter in either connection field connects, rather than reaching for the
      // first button in the row -- which is `paste token`, and is not what
      // somebody who has just finished typing a url is asking for.
      for (const input of [$('url'), $('token')]) {
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') connect();
        });
      }

      // Enter in any action field runs that section's first button, so a count
      // can be typed and applied without reaching for the mouse.
      for (const input of document.querySelectorAll('input:not(#url):not(#token)')) {
        input.onkeydown = (event) => {
          if (event.key !== 'Enter') return;
          const button = input.closest('.row')?.querySelector('button') ?? input.closest('.panel')?.querySelector('button');
          button?.click();
        };
      }

      // The moment the operator alt-tabs back from the terminal they copied it
      // in. Both events fire on that in some combination, and `offerToken` is
      // idempotent, so a double is nothing.
      window.addEventListener('focus', () => { void offerClipboard(); });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) void offerClipboard();
      });

      // --- boot -----------------------------------------------------------
      // The server signs a throwaway key per boot unless ADMIN_SECRET is set, so
      // pasting a JWT is otherwise the first thing an operator does every time.
      const saved = readStore();
      $('url').value = saved.url || (location.protocol === 'https:' ? 'wss://' + location.host : 'ws://' + (location.host || 'localhost:8787'));
      $('token').value = saved.token || '';
      setActionsEnabled(false);
      $('playersEmpty').hidden = false;
      renderToken();

      // The clipboard gets first refusal, because a remembered token is the one
      // thing on this page that a reboot guarantees is wrong -- and adopting one
      // connects, so this is also the connect. The saved token gets its turn only
      // if the clipboard had nothing to say, which is what `socket` asks: it is
      // set by the `connect` inside `adopt`.
      void offerClipboard().then(() => {
        if (!socket && $('token').value) connect();
      });
    </script>
  </body>
</html>
